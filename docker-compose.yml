services:
  postgres:
    image: postgres:16-alpine
    container_name: dataforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First boot only: bootstraps an empty volume. Existing databases are
      # upgraded with the `migrate` service / `python -m src.ops.migrate`.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dataforge_net

  minio:
    image: minio/minio:latest
    container_name: dataforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dataforge_net

  minio-init:
    image: minio/mc:latest
    container_name: dataforge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_BRONZE} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_SILVER} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_QUARANTINE} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_GOLD} &&
      mc ls local
      "
    networks:
      - dataforge_net

  # One-shot: applies pending control-plane migrations and records them in
  # schema_migrations. Safe to re-run: `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: dataforge-api:local
    container_name: dataforge-migrate
    command: ["python", "-m", "src.ops.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATAFORGE_ENV: ${DATAFORGE_ENV:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
    networks:
      - dataforge_net

  # Containerized control-plane API (same image as AWS). Opt-in so it does not
  # clash with `uvicorn --reload` on the host: `docker compose --profile api up -d`.
  api:
    image: dataforge-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataforge-api
    profiles: ["api"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      DATAFORGE_ENV: ${DATAFORGE_ENV:-local}
      DATAFORGE_LOG_LEVEL: ${DATAFORGE_LOG_LEVEL:-INFO}
      DATAFORGE_LOG_FORMAT: json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
      MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - dataforge_net

  airflow-db:
    image: postgres:16-alpine
    container_name: dataforge-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dataforge_net

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: dataforge-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: db migrate
    volumes:
      - airflow_logs:/opt/airflow/logs
    networks:
      - dataforge_net

  airflow-api-server:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: dataforge-airflow-api-server
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATAFORGE_ENV: ${DATAFORGE_ENV:-local}
      DATAFORGE_LOG_FORMAT: json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
      MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD}
    command: api-server
    ports:
      - "8080:8080"
    volumes:
      - ./:/opt/dataforge
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    networks:
      - dataforge_net

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: dataforge-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATAFORGE_ENV: ${DATAFORGE_ENV:-local}
      DATAFORGE_LOG_FORMAT: json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
      MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD}
    command: scheduler
    volumes:
      - ./:/opt/dataforge
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    networks:
      - dataforge_net

  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: dataforge-airflow-dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: dag-processor
    volumes:
      - ./:/opt/dataforge
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    networks:
      - dataforge_net

volumes:
  postgres_data:
  minio_data:
  airflow_postgres_data:
  airflow_logs:

networks:
  dataforge_net:
    driver: bridge
