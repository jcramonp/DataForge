# Shared by every Airflow service. Pipeline tasks run inside the scheduler
# (LocalExecutor) and import src.* from the repository mounted at /opt/dataforge.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  restart: unless-stopped
  # Source credentials (DATAFORGE_CONNECTION_<REF>) declared in .env must reach
  # the workers; keys under `environment` below still take precedence.
  env_file:
    - path: .env
      required: false
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USERNAME:-admin}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    PYTHONPATH: /opt/dataforge
    DATAFORGE_ENV: ${DATAFORGE_ENV:-local}
    DATAFORGE_LOG_FORMAT: json
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
    MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
    MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE}
    MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD}
  volumes:
    - ./:/opt/dataforge
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
  networks:
    - dataforge_net

services:
  postgres:
    image: postgres:16-alpine
    container_name: dataforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First boot only: bootstraps an empty volume. Existing databases are
      # upgraded with the `migrate` service / `python -m src.ops.migrate`.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dataforge_net

  minio:
    # The official minio/minio and minio/mc images were removed from Docker Hub
    # and quay.io. Chainguard publishes maintained builds of the same MinIO
    # server/client from source (free tier: `latest` tag only).
    image: cgr.dev/chainguard/minio:latest
    container_name: dataforge-minio
    # Root, like the former official image: keeps existing minio_data volumes
    # readable and lets the server initialize a fresh named volume.
    user: "0:0"
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # The image has bash but no curl/wget: probe the liveness endpoint via /dev/tcp.
      test: ["CMD-SHELL", 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1

Host: localhost

Connection: close



" >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dataforge_net

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: dataforge-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command:
      - mb
      - --ignore-existing
      - local/${MINIO_BUCKET_BRONZE}
      - local/${MINIO_BUCKET_SILVER}
      - local/${MINIO_BUCKET_QUARANTINE}
      - local/${MINIO_BUCKET_GOLD}
    networks:
      - dataforge_net

  # One-shot: applies pending control-plane migrations and records them in
  # schema_migrations. Safe to re-run: `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: dataforge-api:local
    container_name: dataforge-migrate
    command: ["python", "-m", "src.ops.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATAFORGE_ENV: ${DATAFORGE_ENV:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
    networks:
      - dataforge_net

  # Containerized control-plane API (same image as AWS). Opt-in so it does not
  # clash with `uvicorn --reload` on the host: `docker compose --profile api up -d`.
  api:
    image: dataforge-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataforge-api
    profiles: ["api"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      DATAFORGE_ENV: ${DATAFORGE_ENV:-local}
      DATAFORGE_LOG_LEVEL: ${DATAFORGE_LOG_LEVEL:-INFO}
      DATAFORGE_LOG_FORMAT: json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
      MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - dataforge_net

  airflow-db:
    image: postgres:16-alpine
    container_name: dataforge-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dataforge_net

  airflow-init:
    <<: *airflow-common
    container_name: dataforge-airflow-init
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy
    command: db migrate

  airflow-api-server:
    <<: *airflow-common
    container_name: dataforge-airflow-api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    # Login for the UI and REST API comes from AIRFLOW_ADMIN_USERNAME/PASSWORD.
    command: ["bash", "-c", "python /opt/dataforge/airflow/write_auth_file.py && exec airflow api-server"]
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"

  airflow-scheduler:
    <<: *airflow-common
    container_name: dataforge-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    container_name: dataforge-airflow-dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor

volumes:
  postgres_data:
  minio_data:
  airflow_postgres_data:
  airflow_logs:

networks:
  dataforge_net:
    driver: bridge
