name: CI

# Validates every pull request before merge (#32). The final "CI status" job
# aggregates all checks so branch protection can require a single check.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

env:
  DATAFORGE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATAFORGE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.8.6
      - run: ruff check --output-format=github .
      - name: Validate deployment shell syntax
        run: bash -n scripts/aws/deploy_app.sh

  unit-tests:
    name: Unit & regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATAFORGE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run Sprint 1 + Sprint 2 unit and regression suite
        env:
          GX_ANALYTICS_ENABLED: "false"
        run: python -m unittest discover -s tests -t . -v

  integration-tests:
    name: Integration (PostgreSQL + MinIO)
    runs-on: ubuntu-latest
    env:
      DATAFORGE_ENV_FILE: config/environments/test.env
      DATAFORGE_INTEGRATION: "1"
      GX_ANALYTICS_ENABLED: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dataforge_test
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U dataforge -d dataforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATAFORGE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Start MinIO
        # Service containers cannot override the command, so MinIO runs here.
        # Same image as docker-compose.yml (official minio/minio is no longer published).
        run: |
          docker run -d --name minio --user 0:0 -p 19000:9000 \
            -e MINIO_ROOT_USER=dataforge -e MINIO_ROOT_PASSWORD=dataforge_test \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:19000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - name: Apply migrations to an empty database (twice, to prove idempotency)
        run: |
          python -m src.ops.migrate
          python -m src.ops.migrate
          python -m src.ops.migrate --status
      - name: Run integration tests (migrations, generic pipeline and orchestration end-to-end)
        run: python -m unittest discover -s tests/integration -t . -v
      - name: Readiness check against real services
        run: python -m src.ops.health

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATAFORGE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  containers:
    name: Compose config & API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATAFORGE_REVISION }}
          persist-credentials: false
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile api config --quiet
      - name: Build API image
        run: docker build -t dataforge-api:ci .
      - name: Smoke test API container liveness
        run: |
          docker run -d --name api -p 8000:8000 -e DATAFORGE_ENV=test dataforge-api:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1

  airflow-dag:
    name: Airflow DAG (end-to-end)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dataforge_test
          POSTGRES_USER: dataforge
          POSTGRES_PASSWORD: dataforge_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U dataforge -d dataforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATAFORGE_REVISION }}
          persist-credentials: false
      - name: Start MinIO
        run: |
          docker run -d --name minio --user 0:0 -p 19000:9000 \
            -e MINIO_ROOT_USER=dataforge -e MINIO_ROOT_PASSWORD=dataforge_test \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:19000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - name: Build Airflow image
        run: docker build -f airflow/Dockerfile -t dataforge-airflow:ci .
      - name: Import, structure and execute dataforge_pipeline with airflow dags test
        run: |
          docker run --rm --network host \
            -v "$PWD:/opt/dataforge" -w /opt/dataforge \
            --env-file config/environments/test.env \
            -e PYTHONPATH=/opt/dataforge \
            -e AIRFLOW__CORE__DAGS_FOLDER=/opt/dataforge/airflow/dags \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            --entrypoint bash dataforge-airflow:ci .github/scripts/airflow_dag_e2e.sh

  ci-status:
    name: CI status
    if: always()
    needs: [lint, unit-tests, integration-tests, frontend, containers, airflow-dag]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            exit 1
          fi

  deploy-academy:
    name: Deploy web and API (Academy)
    needs: [ci-status]
    if: >-
      vars.AWS_DEPLOY_ENABLED == 'true' &&
      github.repository == 'jcramonp/DataForge' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'feat/aws-academy-deployment') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: dataforge-academy-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATAFORGE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate temporary Academy credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" && test -n "$AWS_SESSION_TOKEN"
          test "$(aws sts get-caller-identity --query Account --output text)" = 919774751018
      - name: Publish tested source, deploy through SSM and verify live revision
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: python scripts/aws/dispatch_deploy.py

